# Configuration du proxy LiteLLM pour la Forge (opencode.zen).
# Les clés sont lues depuis l'environnement (EnvironmentFile du service litellm),
# jamais écrites en clair dans ce fichier.
model_list:
  - model_name: haiku-5.5
    litellm_params:
      model: openai/haiku-5.5
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: sonnet-4.6
    litellm_params:
      model: openai/sonnet-4.6
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: opus-4.6
    litellm_params:
      model: openai/opus-4.6
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: deepseek-v4-chat
    litellm_params:
      model: openai/deepseek-v4-chat
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
  - model_name: deepseek-v4-reasoner
    litellm_params:
      model: openai/deepseek-v4-reasoner
      api_base: https://opencode.zen/v1
      api_key: os.environ/OPENCODE_API_KEY
