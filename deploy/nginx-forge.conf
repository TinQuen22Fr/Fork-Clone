# =============================================================================
# Claude Unchained Forge — Nginx
#
# ATTENTION : ce fichier est une RECONSTRUCTION du gabarit initial. La config
# réellement en place sur la Dedibox a été adaptée manuellement (le premier
# gabarit référençait un certificat qui n'existait pas encore à l'installation
# et faisait échouer `nginx -t`). NE PAS écraser le fichier en production sans
# avoir comparé au préalable :
#
#   diff deploy/nginx-forge.conf /etc/nginx/sites-available/forge
#
# À déposer dans /etc/nginx/sites-available/forge puis :
#   sudo ln -s /etc/nginx/sites-available/forge /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name forge.quentin-astro.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Écoute en UDP pour le protocole HTTP/3 (QUIC).
    # PAS de reuseport ici : cette option est déjà déclarée une fois pour
    # toutes par un autre site (storm-monitor.conf) sur le même port 443/UDP.
    # reuseport est une option de socket globale au port, pas au vhost : la
    # redéclarer ailleurs fait échouer `nginx -t` (duplicate listen options).
    listen 443 quic;
    listen [::]:443 quic;

    server_name forge.quentin-astro.fr;

    # Protection anti-usurpation d'adresse, recommandée pour QUIC.
    quic_retry on;

    # Annonce aux navigateurs que HTTP/3 est disponible sur ce port (obligatoire,
    # sans ça aucun client ne tentera QUIC : la découverte se fait via cet en-tête).
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # --- TLS (certbot --nginx renseigne ces lignes automatiquement) ---
    # HTTP/3 exige obligatoirement TLS 1.3 ; on garde TLS 1.2 pour la
    # compatibilité des anciens clients qui ne négocient pas HTTP/3.
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /etc/letsencrypt/live/forge.quentin-astro.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge.quentin-astro.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Nécessaire pour que la réponse Alt-Svc soit envoyée même sur les
    # requêtes h1/h2 (première connexion, avant bascule en h3).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload d'image (8 Mo côté appli) + marge pour l'encodage multipart.
    client_max_body_size 12M;

    access_log /var/log/nginx/forge.access.log;
    error_log  /var/log/nginx/forge.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    root /var/www/forge/frontend/build;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
