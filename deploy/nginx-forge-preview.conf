#
# Modele : les marqueurs __PREVIEW_DOMAIN__, __PREVIEW_DIR__ et __PREVIEW_PORT__
# sont remplaces par deploy/setup-preview.sh, qui ecrit le resultat dans
# /etc/nginx/sites-available/forge-preview (activation manuelle).
#
# La production (forge.quentin-astro.fr -> 127.0.0.1:8001) n'est pas concernee.

server {
    listen 80;
    listen [::]:80;
    server_name __PREVIEW_DOMAIN__;

    # Laisse passer certbot, redirige le reste en HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PREVIEW_DOMAIN__;

    # Certificats : sudo certbot --nginx -d __PREVIEW_DOMAIN__
    ssl_certificate     /etc/letsencrypt/live/__PREVIEW_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PREVIEW_DOMAIN__/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Instance de test : on evite tout referencement.
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 64m;
    root __PREVIEW_DIR__/frontend/build;
    index index.html;

    access_log /var/log/nginx/forge-preview.access.log;
    error_log  /var/log/nginx/forge-preview.error.log;

    # --- API : reverse proxy vers le backend preview -----------------------
    location /api/ {
        proxy_pass http://127.0.0.1:__PREVIEW_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # Streaming SSE : aucun tampon, aucune coupure prematuree.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # --- PWA : ne jamais mettre en cache le service worker ----------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # --- Assets versionnes -------------------------------------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
